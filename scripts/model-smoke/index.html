<!doctype html>
<!-- Smoke test page: loads one real hull through the relay with ccpwgl2.
     Served by run.mjs in CI next to the library's dist files. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>model smoke test</title>
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; width: 640px; height: 400px; }
    </style>
  </head>
  <body>
    <canvas id="canvas3d" width="640" height="400"></canvas>
    <script src="ccpwgl2_int.min.js"></script>
    <script>
      const RELAY = 'https://eve-p2p-res.dustin-m117.workers.dev'
      const DNA = new URLSearchParams(location.search).get('dna') || 'ab1_t1:amarrbase:amarr'
      const log = (...args) => console.log('[smoke]', ...args)
      window.__state = 'starting'

      // The game's data gains fields over time, and the library must know each
      // one to read a file at all. Its source cannot currently be rebuilt (a
      // dependency is unpublished), so missing fields are declared here at run
      // time. KNOWN lists the ones confirmed so far; anything else the reader
      // trips over is recorded, guessed to be a string, and the page reloads to
      // try again, so one run reports every missing field.
      const KNOWN = [['EveSOFDataHullController', 'visibilityGroup', 'string']]
      const READERS = {
        string: (r) => r.ReadStringU16(),
      }
      const guessed = JSON.parse(sessionStorage.getItem('guessed') || '[]')
      for (const [type, prop, kind] of [...KNOWN, ...guessed]) {
        const cls = tw2.GetClass(type)
        if (!cls) { log(`no class ${type} to patch`); continue }
        cls.blackReaders = { ...(cls.blackReaders || {}), [prop]: READERS[kind] }
      }
      if (guessed.length) log('guessed fields so far:', JSON.stringify(guessed))

      let unknown = null
      for (const name of ['group', 'groupCollapsed', 'error', 'warn', 'log']) {
        const original = console[name].bind(console)
        console[name] = (...args) => {
          const hit = /Unknown property "(.+?)" for "(.+?)"/.exec(args.map(String).join(' '))
          if (hit) unknown = [hit[2], hit[1], 'string']
          original(...args)
        }
      }

      ;(async () => {
        try {
          tw2.Register({ paths: { res: `${RELAY}/res/`, r: `${RELAY}/res/` } })
          await tny.Initialize({
            canvas: 'canvas3d',
            camera: {},
            device: {
              effectProfile: tw2.const.DeviceEffectProfile.DX11,
              shaderQuality: tw2.const.DeviceShaderQuality.MEDIUM,
            },
          })
          log('initialized')
          const scene = await tny.FetchScene('res:/dx9/scene/universe/a01_cube.black')
          log('scene fetched')
          let last = -1
          const ship = await scene.Fetch(DNA, ({ percent, pending, total }) => {
            const step = Math.floor(percent / 10)
            if (step !== last) log(`progress ${percent}% (${pending} of ${total} outstanding)`)
            last = step
          })
          log('ship fetched:', ship && ship.constructor && ship.constructor.name)
          window.__state = 'loaded'
        } catch (err) {
          if (unknown && guessed.length < 25 && !guessed.some((g) => g[0] === unknown[0] && g[1] === unknown[1])) {
            log(`unknown field ${unknown[0]}.${unknown[1]}: guessing string and reloading`)
            sessionStorage.setItem('guessed', JSON.stringify([...guessed, unknown]))
            location.reload()
            return
          }
          log('FAILED', (err && (err.stack || err.message || err.name)) || String(err))
          window.__state = 'error'
        }
      })()
    </script>
  </body>
</html>
