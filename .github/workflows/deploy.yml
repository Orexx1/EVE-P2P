# Tests, builds and publishes the site to GitHub Pages on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Game resource index for the model relay. If the content servers are
      # unreachable the site still deploys, just without a fresh index.
      - name: Build resource index
        run: node scripts/build-res-index.mjs
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Proves the model pipeline end to end: index on the site, relay on Cloudflare,
  # file from the game's content server.
  verify-relay:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-relay.mjs
      # The relay is deployed by Cloudflare from the same push; this waits for it.
      - name: Check duel rooms on the relay
        run: node scripts/verify-room.mjs
