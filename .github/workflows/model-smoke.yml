# Loads one real EVE hull through the relay with ccpwgl2 in headless Chrome and
# saves a screenshot. Runs when the smoke test changes, or on demand.
name: Model smoke test

on:
  push:
    branches: [main]
    paths: ['scripts/model-smoke/**', '.github/workflows/model-smoke.yml']
  workflow_dispatch:
    inputs:
      dna:
        description: Ship DNA (hull:faction:race)
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ccpwgl2 (pinned)
        run: |
          git init -q /tmp/ccpwgl2
          git -C /tmp/ccpwgl2 fetch -q --depth 1 https://github.com/cppctamber/ccpwgl2 fa3c4dba1ecff5343a7e7349e3de7f970519df82
          git -C /tmp/ccpwgl2 checkout -q FETCH_HEAD
          ls -la /tmp/ccpwgl2/dist
      - name: Install headless Chrome driver
        run: cd scripts/model-smoke && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer
      - name: Render a hull
        run: node scripts/model-smoke/run.mjs /tmp/ccpwgl2/dist /tmp/smoke-out
        env:
          DNA: ${{ inputs.dna }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-smoke
          path: /tmp/smoke-out
