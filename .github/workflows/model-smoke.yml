# Loads one real EVE hull through the relay with ccpwgl2 in headless Chrome and
# saves a screenshot. Runs when the smoke test changes, or on demand.
name: Model smoke test

on:
  push:
    branches: [main]
    paths:
      - 'scripts/model-smoke/**'
      - 'scripts/site-smoke/**'
      - 'scripts/build-res-index.mjs'
      - 'scripts/fetch-ccpwgl2.mjs'
      - 'src/arena/**'
      - 'src/ui/crashGuard.ts'
      - 'src/ui/graphics.ts'
      - 'worker/**'
      - '.github/workflows/model-smoke.yml'
  workflow_dispatch:
    inputs:
      dna:
        description: Ship DNA (hull:faction:race) for the single-hull check
        required: false
      fit:
        description: Sample fit for the fight check (0 Rifter, 1 Merlin, 2 Caracal, 3 Vexor, 4 Vendetta)
        required: false
      gfx:
        description: Graphics options for the fight check, as JSON
        required: false
      extras:
        description: Extra ships for the fight check, like "merlin:0,caracal:1" (0 ally, 1 enemy)
        required: false
      scenario:
        description: Scenario to fly in the fight check instead, by id (brawl, hotdrop, range, ...)
        required: false
      blank:
        description: Set to 1 to make the engine draw nothing in the fight check, or to throw to make it fail on every frame, as a device that loads the models and cannot show them does
        required: false
      lose:
        description: Set to 1 to take the graphics context away mid-fight in the fight check, as a phone short of memory does
        required: false
      hide:
        description: WebGL extensions the browser should deny in the fight check, like "s3tc,rgtc,bptc" (a phone without desktop texture compression)
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ccpwgl2 (pinned)
        run: |
          git init -q /tmp/ccpwgl2
          git -C /tmp/ccpwgl2 fetch -q --depth 1 https://github.com/cppctamber/ccpwgl2 fa3c4dba1ecff5343a7e7349e3de7f970519df82
          git -C /tmp/ccpwgl2 checkout -q FETCH_HEAD
      - name: Inspect the resource index
        run: |
          node scripts/build-res-index.mjs --grep '^graphics/effect\.dx11/.*quadv5' | head -4
      - name: Install headless Chrome driver
        run: cd scripts/model-smoke && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer
      # A push that changes the index builder also redeploys the site; wait for
      # the published index to include the shader index before rendering.
      - name: Wait for the published index
        run: |
          for i in $(seq 1 30); do
            meta=$(curl -fsS "https://orexx1.github.io/EVE-P2P/ri/meta.json?t=$RANDOM" || true)
            echo "$meta"
            case "$meta" in *dx11Shaders*) exit 0 ;; esac
            sleep 10
          done
          echo "published index never included the DX11 shader count" && exit 1
      - name: Wait for the current relay version
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "https://eve-p2p-res.dustin-m117.workers.dev/" || true)
            echo "$body"
            case "$body" in *" v2"*|*" v3"*|*" v4"*) exit 0 ;; esac
            sleep 10
          done
          echo "relay never reported the expected version" && exit 1
      - name: Render a hull
        run: node scripts/model-smoke/run.mjs /tmp/ccpwgl2/dist /tmp/smoke-out
        env:
          DNA: ${{ inputs.dna }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-smoke
          path: /tmp/smoke-out

  # The real thing: the built site, a solo fight, real hulls taking over from
  # the stand-ins. Screenshots are printed into the log as base64.
  fight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install headless Chrome driver
        run: cd scripts/site-smoke && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer
      - name: Fly a solo fight with real models
        run: node scripts/site-smoke/run.mjs "$PWD/dist" /tmp/fight-out
        env:
          FIT: ${{ inputs.fit }}
          GFX: ${{ inputs.gfx }}
          EXTRAS: ${{ inputs.extras || 'merlin:0,caracal:1' }}
          SCENARIO: ${{ inputs.scenario }}
          HIDE_EXT: ${{ inputs.hide }}
          LOSE: ${{ inputs.lose }}
          BLANK: ${{ inputs.blank }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fight-smoke
          path: /tmp/fight-out

  # Kills the page for real while the ship models load, as a phone's browser does when
  # it runs out of memory, and checks that the next visit goes easier and says so.
  killed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install headless Chrome driver
        run: cd scripts/site-smoke && npm init -y >/dev/null && npm install --no-audit --no-fund puppeteer
      - name: Kill the page while models load, twice
        run: node scripts/site-smoke/crash.mjs "$PWD/dist" /tmp/killed-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: killed
          path: /tmp/killed-out
